services:
  mongo:
    image: mongo:8.0
    container_name: samaj-mongo
    restart: unless-stopped
    ports:
      # Host port. Override with MONGO_PORT in .env if 27017 is taken (e.g. by a local MongoDB service).
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
